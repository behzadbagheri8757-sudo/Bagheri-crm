name: BAGHERI CRM - FINANCIAL FIFO RUNTIME AUDIT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  financial-fifo-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create Playwright config
        run: |
          cat > playwright.config.js <<'EOF'
          const { defineConfig } = require('@playwright/test');

          module.exports = defineConfig({
            testDir: './tests',
            timeout: 90000,
            expect: { timeout: 10000 },
            use: {
              baseURL: 'http://127.0.0.1:8080',
              browserName: 'chromium',
              headless: true
            },
            reporter: [['list']]
          });
          EOF

      - name: Start server
        run: |
          python3 -m http.server 8080 > /tmp/bagheri-server.log 2>&1 &
          sleep 2

      - name: Create financial audit tests
        run: |
          mkdir -p tests

          cat > tests/financial-fifo-audit.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');

          async function boot(page) {
            const errors = [];

            page.on('pageerror', e => {
              errors.push(e.message);
            });

            await page.goto('/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1200);

            expect(errors, 'boot runtime errors').toEqual([]);
          }

          async function runCoreScenario(page) {
            return await page.evaluate(() => {

              /*
               * کاملاً in-memory.
               * هیچ saveData / dbPut / IndexedDB استفاده نمی‌شود.
               */

              data = {
                schemaVersion: 999,
                products: [],
                customers: [],
                invoices: [],
                payments: [],
                checks: [],
                suppliers: [],
                visits: [],
                inventoryLayers: []
              };

              const product = {
                id: 'QA-P1',
                name: 'QA FIFO PRODUCT',
                stockQty: 0,
                buy: 100
              };

              const customer = {
                id: 'QA-C1',
                name: 'QA CUSTOMER',
                openingBalance: 0,
                active: true
              };

              data.products.push(product);
              data.customers.push(customer);

              /*
               * PURCHASE #1
               * 10 units @ 100
               */
              const purchase1 = {
                id: 'QA-BUY-1',
                productId: product.id,
                qty: 10,
                amount: 1000,
                date: '2026-01-01'
              };

              applyPurchaseStockEffects(purchase1, 'QA SUPPLIER');

              /*
               * PURCHASE #2
               * 10 units @ 200
               */
              const purchase2 = {
                id: 'QA-BUY-2',
                productId: product.id,
                qty: 10,
                amount: 2000,
                date: '2026-01-02'
              };

              applyPurchaseStockEffects(purchase2, 'QA SUPPLIER');

              const afterPurchases = {
                stock: product.stockQty,
                layers: data.inventoryLayers.map(l => ({
                  purchaseId: l.purchaseId,
                  qtyOriginal: l.qtyOriginal,
                  qtyRemaining: l.qtyRemaining,
                  unitCost: l.unitCost,
                  status: l.status
                }))
              };

              /*
               * EXPECTATION:
               * stock = 20
               * layer1 = 10 @100
               * layer2 = 10 @200
               */

              /*
               * SALE #1
               * 12 units @ 300
               *
               * FIFO must consume:
               * 10 @100
               * 2  @200
               *
               * COGS = 1400
               */
              const invoice = {
                id: 'QA-INV-1',
                number: 'QA-1001',
                customerId: customer.id,
                date: '2026-01-03',
                total: 3600,
                items: [{
                  id: 'QA-ITEM-1',
                  productId: product.id,
                  name: product.name,
                  qty: 12,
                  price: 300,
                  discount: 0
                }]
              };

              applyInvoiceStockEffects(
                invoice.items,
                invoice.date,
                invoice,
                true
              );

              data.invoices.push(invoice);

              const saleAllocations = invoice.items[0].costAllocations;

              const afterSale = {
                stock: product.stockQty,
                cogs: invoice.items[0].cogs,
                buyPrice: invoice.items[0].buyPrice,
                allocations: saleAllocations.map(a => ({
                  qty: a.qty,
                  unitCost: a.unitCost,
                  cost: a.cost
                })),
                layers: data.inventoryLayers.map(l => ({
                  purchaseId: l.purchaseId,
                  qtyRemaining: l.qtyRemaining,
                  unitCost: l.unitCost,
                  status: l.status
                }))
              };

              /*
               * CUSTOMER BALANCE
               *
               * invoice = 3600
               * payment = 1000
               * balance = 2600
               */
              data.payments.push({
                id: 'QA-PAY-1',
                customerId: customer.id,
                amount: 1000,
                method: 'cash',
                date: '2026-01-04'
              });

              const totalsAfterPayment =
                customerTotals(customer.id);

              /*
               * RETURN 2 units from the invoice.
               *
               * Return must use the original FIFO cost allocation,
               * not the current product.buy.
               *
               * The next 2 units in the original allocation are @200.
               */
              const returnPayment = {
                id: 'QA-RET-1',
                customerId: customer.id,
                invoiceId: invoice.id,
                method: 'return',
                amount: 600,
                date: '2026-01-05',
                returnItems: [{
                  productId: product.id,
                  qty: 2,
                  price: 300
                }]
              };

              data.payments.push(returnPayment);

              applyReturnStockEffects(
                returnPayment.returnItems,
                returnPayment.date,
                returnPayment
              );

              const afterReturn = {
                stock: product.stockQty,
                layers: data.inventoryLayers.map(l => ({
                  purchaseId: l.purchaseId,
                  source: l.source,
                  qtyRemaining: l.qtyRemaining,
                  unitCost: l.unitCost,
                  status: l.status
                }))
              };

              const totalsAfterReturn =
                customerTotals(customer.id);

              /*
               * REVERT THE ORIGINAL INVOICE STOCK EFFECT.
               *
               * Stock should return to the state before the sale,
               * except that the sale return is now an independent
               * sale-return layer.
               */
              revertInvoiceStockEffects(invoice);

              const afterInvoiceRevert = {
                stock: product.stockQty,
                fifoAvailable: fifoAvailableQty(product.id),
                layers: data.inventoryLayers.map(l => ({
                  purchaseId: l.purchaseId,
                  source: l.source,
                  qtyRemaining: l.qtyRemaining,
                  unitCost: l.unitCost,
                  status: l.status
                }))
              };

              /*
               * INSUFFICIENT STOCK TEST
               *
               * Current stock after revert should be sufficient.
               * Requesting 100 units must fail BEFORE mutation.
               */
              const beforeInvalidStock = JSON.stringify({
                stock: product.stockQty,
                layers: data.inventoryLayers.map(l => ({
                  qtyRemaining: l.qtyRemaining,
                  status: l.status
                }))
              });

              let invalidSaleResult = null;

              try {
                applyInvoiceStockEffects(
                  [{
                    id: 'QA-INVALID',
                    productId: product.id,
                    name: product.name,
                    qty: 100,
                    price: 300
                  }],
                  '2026-01-06',
                  {
                    id: 'QA-INVALID-INV',
                    number: 'QA-9999'
                  },
                  true
                );

                invalidSaleResult = {
                  threw: false
                };
              } catch (e) {
                invalidSaleResult = {
                  threw: true,
                  code: e.code || null,
                  message: e.message || ''
                };
              }

              const afterInvalidStock = JSON.stringify({
                stock: product.stockQty,
                layers: data.inventoryLayers.map(l => ({
                  qtyRemaining: l.qtyRemaining,
                  status: l.status
                }))
              });

              return {
                afterPurchases,
                afterSale,
                totalsAfterPayment,
                afterReturn,
                totalsAfterReturn,
                afterInvoiceRevert,
                invalidSaleResult,
                invalidSaleDidMutate:
                  beforeInvalidStock !== afterInvalidStock
              };
            });
          }

          test('01 - purchase creates correct stock and FIFO layers', async ({ page }) => {
            await boot(page);

            const r = await runCoreScenario(page);

            console.log(
              'PURCHASE_STATE:',
              JSON.stringify(r.afterPurchases, null, 2)
            );

            expect(r.afterPurchases.stock).toBe(20);
            expect(r.afterPurchases.layers.length).toBe(2);

            expect(
              r.afterPurchases.layers.find(
                x => x.unitCost === 100
              ).qtyRemaining
            ).toBe(10);

            expect(
              r.afterPurchases.layers.find(
                x => x.unitCost === 200
              ).qtyRemaining
            ).toBe(10);
          });

          test('02 - sale consumes FIFO layers in correct order', async ({ page }) => {
            await boot(page);

            const r = await runCoreScenario(page);

            console.log(
              'SALE_STATE:',
              JSON.stringify(r.afterSale, null, 2)
            );

            expect(r.afterSale.stock).toBe(8);

            expect(r.afterSale.cogs).toBe(1400);

            expect(r.afterSale.buyPrice).toBeCloseTo(
              1400 / 12,
              8
            );

            expect(r.afterSale.allocations.length).toBe(2);

            expect(r.afterSale.allocations[0].qty).toBe(10);
            expect(r.afterSale.allocations[0].unitCost).toBe(100);

            expect(r.afterSale.allocations[1].qty).toBe(2);
            expect(r.afterSale.allocations[1].unitCost).toBe(200);
          });

          test('03 - customer balance calculation is correct', async ({ page }) => {
            await boot(page);

            const r = await runCoreScenario(page);

            console.log(
              'BALANCE_AFTER_PAYMENT:',
              JSON.stringify(r.totalsAfterPayment, null, 2)
            );

            expect(r.totalsAfterPayment.invTotal).toBe(3600);
            expect(r.totalsAfterPayment.payTotal).toBe(1000);
            expect(r.totalsAfterPayment.balance).toBe(2600);
          });

          test('04 - sale return restores stock with original FIFO cost', async ({ page }) => {
            await boot(page);

            const r = await runCoreScenario(page);

            console.log(
              'RETURN_STATE:',
              JSON.stringify(r.afterReturn, null, 2)
            );

            /*
             * Before return: stock 8
             * Return 2 => stock 10
             */
            expect(r.afterReturn.stock).toBe(10);

            /*
             * The returned 2 units came from the second FIFO allocation:
             * 2 @ 200.
             */
            const returnedLayer =
              r.afterReturn.layers.find(
                x => x.source === 'sale-return'
              );

            expect(returnedLayer).toBeTruthy();
            expect(returnedLayer.qtyRemaining).toBe(2);
            expect(returnedLayer.unitCost).toBe(200);
          });

          test('05 - customer balance reflects return payment correctly', async ({ page }) => {
            await boot(page);

            const r = await runCoreScenario(page);

            console.log(
              'BALANCE_AFTER_RETURN:',
              JSON.stringify(r.totalsAfterReturn, null, 2)
            );

            /*
             * customerTotals formula is:
             * opening + invoices - payments - checks
             *
             * payments now:
             * 1000 cash + 600 return = 1600
             *
             * balance = 3600 - 1600 = 2000
             */
            expect(r.totalsAfterReturn.invTotal).toBe(3600);
            expect(r.totalsAfterReturn.payTotal).toBe(1600);
            expect(r.totalsAfterReturn.returnTotal).toBe(600);
            expect(r.totalsAfterReturn.balance).toBe(2000);
          });

          test('06 - invoice stock revert restores the consumed FIFO allocation', async ({ page }) => {
            await boot(page);

            const r = await runCoreScenario(page);

            console.log(
              'INVOICE_REVERT_STATE:',
              JSON.stringify(r.afterInvoiceRevert, null, 2)
            );

            /*
             * Reverting the invoice restores its original consumed
             * allocations to their source layers.
             *
             * Sale return layer remains independent.
             *
             * Total available FIFO should therefore be:
             * original 20 + returned 2 = 22
             *
             * because the invoice itself has been reverted.
             */
            expect(r.afterInvoiceRevert.stock).toBe(22);
            expect(r.afterInvoiceRevert.fifoAvailable).toBe(22);
          });

          test('07 - impossible sale is rejected atomically', async ({ page }) => {
            await boot(page);

            const r = await runCoreScenario(page);

            console.log(
              'INVALID_SALE:',
              JSON.stringify({
                result: r.invalidSaleResult,
                mutated: r.invalidSaleDidMutate
              }, null, 2)
            );

            expect(r.invalidSaleResult.threw).toBe(true);

            expect(
              ['STOCK', 'FIFO_DESYNC', 'NEGATIVE_STOCK']
            ).toContain(r.invalidSaleResult.code);

            expect(r.invalidSaleDidMutate).toBe(false);
          });

          test('08 - FIFO unit-cost valuation matches remaining layers', async ({ page }) => {
            await boot(page);

            const r = await runCoreScenario(page);

            const valuation = await page.evaluate(() => {
              return {
                fifoAvailable: fifoAvailableQty('QA-P1'),
                fifoUnitCost: productFifoUnitCost('QA-P1'),
                inventoryValue: productInventoryValue('QA-P1'),
                globalInventoryValue: inventoryValue()
              };
            });

            console.log(
              'FIFO_VALUATION:',
              JSON.stringify(valuation, null, 2)
            );

            /*
             * After full invoice revert:
             * 10 @100
             * 10 @200
             * 2 @200 return layer
             *
             * value = 1000 + 2000 + 400 = 3400
             */
            expect(valuation.fifoAvailable).toBe(22);
            expect(valuation.inventoryValue).toBe(3400);
            expect(valuation.globalInventoryValue).toBe(3400);

            expect(valuation.fifoUnitCost)
              .toBeCloseTo(3400 / 22, 8);
          });

          test('09 - return over original sold quantity is blocked', async ({ page }) => {
            await boot(page);

            const result = await page.evaluate(() => {
              data = {
                schemaVersion: 999,
                products: [{
                  id: 'P',
                  name: 'P',
                  stockQty: 5,
                  buy: 100
                }],
                customers: [{
                  id: 'C',
                  name: 'C',
                  openingBalance: 0
                }],
                invoices: [{
                  id: 'INV',
                  number: '1',
                  customerId: 'C',
                  date: '2026-01-01',
                  total: 500,
                  items: [{
                    id: 'I',
                    productId: 'P',
                    qty: 5,
                    price: 100,
                    buyPrice: 100,
                    costAllocations: [{
                      layerId: 'L',
                      qty: 5,
                      unitCost: 100,
                      cost: 500
                    }]
                  }]
                }],
                payments: [],
                checks: [],
                suppliers: [],
                inventoryLayers: [{
                  id: 'L',
                  purchaseId: 'BUY',
                  productId: 'P',
                  qtyOriginal: 5,
                  qtyRemaining: 0,
                  unitCost: 100,
                  status: 'depleted',
                  source: 'purchase',
                  date: '2026-01-01'
                }]
              };

              const before = JSON.stringify({
                stock: data.products[0].stockQty,
                layers: data.inventoryLayers
              });

              let threw = false;
              let code = null;

              const payment = {
                id: 'RET-OVER',
                customerId: 'C',
                invoiceId: 'INV'
              };

              try {
                applyReturnStockEffects(
                  [{
                    productId: 'P',
                    qty: 6,
                    price: 100
                  }],
                  '2026-01-02',
                  payment
                );
              } catch (e) {
                threw = true;
                code = e.code || null;
              }

              const after = JSON.stringify({
                stock: data.products[0].stockQty,
                layers: data.inventoryLayers
              });

              return {
                threw,
                code,
                mutated: before !== after
              };
            });

            console.log(
              'OVER_RETURN:',
              JSON.stringify(result, null, 2)
            );

            expect(result.threw).toBe(true);
            expect(result.code).toBe('RETURN_QTY_EXCEEDED');
            expect(result.mutated).toBe(false);
          });

          test('10 - final financial/FIFO integrity snapshot', async ({ page }) => {
            await boot(page);

            const r = await runCoreScenario(page);

            console.log(
              'FINAL_FINANCIAL_FIFO_SNAPSHOT:',
              JSON.stringify(r, null, 2)
            );

            expect(r.afterPurchases.stock).toBe(20);
            expect(r.afterSale.stock).toBe(8);
            expect(r.afterSale.cogs).toBe(1400);
            expect(r.afterReturn.stock).toBe(10);
            expect(r.afterInvoiceRevert.stock).toBe(22);
            expect(r.afterInvoiceRevert.fifoAvailable).toBe(22);
            expect(r.invalidSaleDidMutate).toBe(false);
          });
          EOF

      - name: Run financial/FIFO audit
        run: npx playwright test

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/bagheri-server.log || true
