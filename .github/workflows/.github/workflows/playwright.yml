name: BAGHERI CRM Runtime Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BAGHERI CRM
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start BAGHERI CRM
        run: |
          nohup python3 -m http.server 8080 > server.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:8080/index.html

      - name: Create diagnostic test
        run: |
          mkdir -p tests

          cat > tests/runtime-diagnostic.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');

          test('BAGHERI CRM runtime diagnostic', async ({ page }) => {
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];

            page.on('pageerror', error => {
              pageErrors.push(error.message);
            });

            page.on('console', message => {
              if (message.type() === 'error') {
                consoleErrors.push(message.text());
              }
            });

            page.on('requestfailed', request => {
              failedRequests.push({
                url: request.url(),
                failure: request.failure()
              });
            });

            await page.goto('http://127.0.0.1:8080/index.html', {
              waitUntil: 'domcontentloaded'
            });

            await page.waitForTimeout(5000);

            const diagnostic = await page.evaluate(async () => {
              const buttons = [...document.querySelectorAll('button')]
                .map((el, i) => ({
                  index: i,
                  id: el.id || null,
                  text: (el.innerText || el.textContent || '').trim(),
                  disabled: !!el.disabled,
                  cls: el.className || ''
                }));

              const inputs = [...document.querySelectorAll('input')]
                .map((el, i) => ({
                  index: i,
                  id: el.id || null,
                  type: el.type || null,
                  placeholder: el.placeholder || null,
                  name: el.name || null
                }));

              const links = [...document.querySelectorAll('a')]
                .map((el, i) => ({
                  index: i,
                  text: (el.innerText || el.textContent || '').trim(),
                  href: el.getAttribute('href')
                }));

              const visibleText =
                document.body?.innerText?.slice(0, 12000) || '';

              let sw = {
                supported: 'serviceWorker' in navigator,
                registrations: []
              };

              if ('serviceWorker' in navigator) {
                try {
                  const registrations =
                    await navigator.serviceWorker.getRegistrations();

                  sw.registrations = registrations.map(r => ({
                    scope: r.scope,
                    active: r.active?.scriptURL || null,
                    installing: r.installing?.scriptURL || null,
                    waiting: r.waiting?.scriptURL || null
                  }));
                } catch (e) {
                  sw.error = String(e);
                }
              }

              const storage = {
                localStorageKeys: Object.keys(localStorage),
                indexedDBDatabases: []
              };

              if (indexedDB.databases) {
                try {
                  storage.indexedDBDatabases =
                    await indexedDB.databases();
                } catch (e) {
                  storage.indexedDBError = String(e);
                }
              }

              const settingsSignals = {
                importButton: !!document.querySelector('#do-import'),
                importFile: !!document.querySelector('#import-file'),
                undoButton: !!document.querySelector('#undo-import'),
                settingsText: visibleText.includes('بازیابی')
              };

              return {
                url: location.href,
                title: document.title,
                readyState: document.readyState,
                buttons,
                inputs,
                links,
                visibleText,
                serviceWorker: sw,
                storage,
                settingsSignals
              };
            });

            console.log(
              '=== BAGHERI RUNTIME DIAGNOSTIC ==='
            );

            console.log(
              JSON.stringify(diagnostic, null, 2)
            );

            console.log(
              '=== PAGE ERRORS ==='
            );

            console.log(
              JSON.stringify(pageErrors, null, 2)
            );

            console.log(
              '=== CONSOLE ERRORS ==='
            );

            console.log(
              JSON.stringify(consoleErrors, null, 2)
            );

            console.log(
              '=== FAILED REQUESTS ==='
            );

            console.log(
              JSON.stringify(failedRequests, null, 2)
            );

            expect(diagnostic.readyState).not.toBe('loading');

            expect(
              diagnostic.settingsSignals.importButton,
              'Expected #do-import to exist after application boot'
            ).toBeTruthy();

            expect(
              diagnostic.settingsSignals.importFile,
              'Expected #import-file to exist after application boot'
            ).toBeTruthy();
          });
          EOF

      - name: Run diagnostic
        run: npx playwright test tests/runtime-diagnostic.spec.js --reporter=line

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagheri-runtime-diagnostic
          path: |
            test-results/
            playwright-report/
            server.log
          if-no-files-found: ignore
