name: BAGHERI CRM - CORE RUNTIME SAFETY AUDIT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  core-runtime-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create Playwright config
        run: |
          cat > playwright.config.js <<'EOF'
          const { defineConfig } = require('@playwright/test');

          module.exports = defineConfig({
            testDir: './tests',
            timeout: 90000,
            expect: {
              timeout: 10000
            },
            use: {
              baseURL: 'http://127.0.0.1:8080',
              browserName: 'chromium',
              headless: true,
              serviceWorkers: 'allow'
            },
            reporter: [['list']]
          });
          EOF

      - name: Start static server
        run: |
          python3 -m http.server 8080 > /tmp/bagheri-server.log 2>&1 &
          echo $! > /tmp/bagheri-server.pid
          sleep 2

      - name: Create core runtime audit
        run: |
          mkdir -p tests

          cat > tests/core-runtime-audit.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');

          async function boot(page) {
            const errors = [];

            page.on('pageerror', e => {
              errors.push('PAGEERROR: ' + e.message);
            });

            page.on('console', msg => {
              if (msg.type() === 'error') {
                errors.push('CONSOLE: ' + msg.text());
              }
            });

            await page.goto('/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1500);

            return errors;
          }

          async function snapshot(page) {
            return await page.evaluate(async () => {
              const out = {
                url: location.href,
                title: document.title,
                bodyTextLength: (document.body?.innerText || '').length,
                buttons: document.querySelectorAll('button').length,
                inputs: document.querySelectorAll('input').length,
                links: document.querySelectorAll('a').length,
                localStorageKeys: Object.keys(localStorage),
                indexedDB: []
              };

              if (indexedDB.databases) {
                try {
                  out.indexedDB = await indexedDB.databases();
                } catch (_) {}
              }

              return out;
            });
          }

          test('01 - application boots cleanly', async ({ page }) => {
            const errors = await boot(page);

            console.log('BOOT_ERRORS:', JSON.stringify(errors, null, 2));

            expect(errors, 'uncaught runtime errors during boot')
              .toEqual([]);

            expect(await page.locator('body').count()).toBe(1);
            expect(await page.locator('body').innerText()).not.toBe('');
          });

          test('02 - core JavaScript resources load', async ({ page }) => {
            const failed = [];

            page.on('requestfailed', request => {
              failed.push({
                url: request.url(),
                failure: request.failure()?.errorText
              });
            });

            await page.goto('/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1000);

            const relevant = failed.filter(x =>
              /\/js\/|\/css\/|sw\.js|index\.html/.test(x.url)
            );

            console.log('CORE_REQUEST_FAILURES:',
              JSON.stringify(relevant, null, 2));

            expect(relevant).toEqual([]);
          });

          test('03 - IndexedDB opens and application storage exists', async ({ page }) => {
            await boot(page);

            const result = await page.evaluate(async () => {
              const dbs = indexedDB.databases
                ? await indexedDB.databases()
                : [];

              return {
                dbs,
                canOpen: await new Promise(resolve => {
                  const req = indexedDB.open('baqeriDB');
                  req.onsuccess = () => {
                    req.result.close();
                    resolve(true);
                  };
                  req.onerror = () => resolve(false);
                })
              };
            });

            console.log('IDB:', JSON.stringify(result, null, 2));

            expect(result.canOpen).toBe(true);
          });

          test('04 - all major SPA routes remain crash-free', async ({ page }) => {
            const routes = [
              '#dashboard',
              '#customers',
              '#products',
              '#inventory',
              '#invoices',
              '#payments',
              '#checks',
              '#suppliers',
              '#visits',
              '#prospects',
              '#reports',
              '#settings'
            ];

            const routeErrors = [];

            for (const route of routes) {
              const errors = [];

              page.on('pageerror', e => {
                errors.push(e.message);
              });

              await page.goto('/' + route, {
                waitUntil: 'networkidle'
              }).catch(() => {});

              await page.waitForTimeout(500);

              if (errors.length) {
                routeErrors.push({
                  route,
                  errors
                });
              }
            }

            console.log(
              'ROUTE_ERRORS:',
              JSON.stringify(routeErrors, null, 2)
            );

            expect(routeErrors).toEqual([]);
          });

          test('05 - application survives reload', async ({ page }) => {
            const errors = await boot(page);

            expect(errors).toEqual([]);

            await page.reload({
              waitUntil: 'networkidle'
            });

            await page.waitForTimeout(1000);

            expect(await page.locator('body').count()).toBe(1);
            expect(await page.locator('body').innerText()).not.toBe('');
          });

          test('06 - Service Worker remains registered', async ({ page }) => {
            await boot(page);

            const sw = await page.evaluate(async () => {
              if (!('serviceWorker' in navigator)) {
                return { supported: false, registrations: [] };
              }

              const regs = await navigator.serviceWorker.getRegistrations();

              return {
                supported: true,
                registrations: regs.map(r => ({
                  scope: r.scope,
                  active: !!r.active,
                  waiting: !!r.waiting,
                  installing: !!r.installing
                }))
              };
            });

            console.log('SERVICE_WORKER:',
              JSON.stringify(sw, null, 2));

            expect(sw.supported).toBe(true);
            expect(sw.registrations.length).toBeGreaterThan(0);
          });

          test('07 - critical application APIs exist', async ({ page }) => {
            await boot(page);

            const api = await page.evaluate(() => ({
              loadData: typeof window.loadData,
              saveData: typeof window.saveData,
              normalizeData: typeof window.normalizeData,
              calcInvoiceTotal: typeof window.calcInvoiceTotal,
              enableQaDbIsolation: typeof window.enableQaDbIsolation,
              disableQaDbIsolation: typeof window.disableQaDbIsolation,
              isQaDbIsolationActive:
                typeof window.isQaDbIsolationActive
            }));

            console.log('CORE_APIS:',
              JSON.stringify(api, null, 2));

            expect(api.loadData).toBe('function');
            expect(api.saveData).toBe('function');
            expect(api.normalizeData).toBe('function');
            expect(api.enableQaDbIsolation).toBe('function');
            expect(api.disableQaDbIsolation).toBe('function');
          });

          test('08 - normalizeData does not corrupt a minimal valid dataset', async ({ page }) => {
            await boot(page);

            const result = await page.evaluate(() => {
              const input = {
                invoiceSeq: 1000,
                products: [
                  {
                    id: 'P1',
                    name: 'TEST PRODUCT',
                    stockQty: 10,
                    buy: 100
                  }
                ],
                customers: [
                  {
                    id: 'C1',
                    name: 'TEST CUSTOMER'
                  }
                ],
                invoices: [],
                payments: [],
                suppliers: [],
                checks: [],
                visits: []
              };

              const out = normalizeData(input);

              return {
                products: out.products?.length,
                customers: out.customers?.length,
                invoices: out.invoices?.length,
                payments: out.payments?.length,
                suppliers: out.suppliers?.length,
                checks: out.checks?.length,
                visits: out.visits?.length,
                productStock: out.products?.[0]?.stockQty
              };
            });

            console.log('NORMALIZE_RESULT:',
              JSON.stringify(result, null, 2));

            expect(result.products).toBe(1);
            expect(result.customers).toBe(1);
            expect(result.productStock).toBe(10);
          });

          test('09 - QA isolation really prevents production DB writes', async ({ page }) => {
            await boot(page);

            const result = await page.evaluate(async () => {
              const before = await dbGet('RECORD_KEY');

              enableQaDbIsolation({
                RECORD_KEY: JSON.stringify({
                  schemaVersion: 999,
                  customers: [
                    { id: 'QA_ONLY', name: 'QA ONLY' }
                  ]
                })
              });

              await dbPut(
                'RECORD_KEY',
                JSON.stringify({
                  schemaVersion: 999,
                  customers: [
                    { id: 'QA_ONLY', name: 'QA ONLY' }
                  ]
                })
              );

              const isolated = await dbGet('RECORD_KEY');

              disableQaDbIsolation();

              const after = await dbGet('RECORD_KEY');

              return {
                before: before?.value || null,
                isolated: isolated?.value || null,
                after: after?.value || null
              };
            });

            console.log(
              'QA_ISOLATION:',
              JSON.stringify(result, null, 2)
            );

            expect(result.isolated).toContain('QA_ONLY');
            expect(result.after).not.toContain('QA_ONLY');
          });

          test('10 - backup/export functions are present', async ({ page }) => {
            await boot(page);

            const result = await page.evaluate(() => {
              const names = [
                'exportBackupJSON',
                'importBackupJSON',
                'createBackupPayload',
                'validateBackup'
              ];

              const found = {};

              for (const name of names) {
                found[name] = typeof window[name];
              }

              return found;
            });

            console.log(
              'BACKUP_APIS:',
              JSON.stringify(result, null, 2)
            );

            const available = Object.values(result)
              .filter(v => v === 'function').length;

            expect(available).toBeGreaterThan(0);
          });

          test('11 - no negative/NaN corruption appears in normalized core data', async ({ page }) => {
            await boot(page);

            const result = await page.evaluate(() => {
              const input = {
                products: [
                  {
                    id: 'P1',
                    name: 'P1',
                    stockQty: 25,
                    buy: 100,
                    wholesale: 150,
                    retail: 180
                  }
                ],
                customers: [
                  {
                    id: 'C1',
                    name: 'C1',
                    balance: 0
                  }
                ],
                invoices: [],
                payments: [],
                suppliers: [],
                checks: []
              };

              const out = normalizeData(input);

              const values = [];

              function walk(x, path = '') {
                if (typeof x === 'number') {
                  values.push({
                    path,
                    value: x,
                    finite: Number.isFinite(x)
                  });
                  return;
                }

                if (Array.isArray(x)) {
                  x.forEach((v, i) => walk(v, path + '[' + i + ']'));
                  return;
                }

                if (x && typeof x === 'object') {
                  Object.keys(x).forEach(k =>
                    walk(x[k], path ? path + '.' + k : k)
                  );
                }
              }

              walk(out);

              return {
                nonFinite: values.filter(x => !x.finite),
                valuesChecked: values.length
              };
            });

            console.log(
              'NUMERIC_INTEGRITY:',
              JSON.stringify(result, null, 2)
            );

            expect(result.nonFinite).toEqual([]);
          });

          test('12 - final runtime snapshot', async ({ page }) => {
            await boot(page);

            const result = await snapshot(page);

            console.log(
              'FINAL_RUNTIME_SNAPSHOT:',
              JSON.stringify(result, null, 2)
            );

            expect(result.bodyTextLength).toBeGreaterThan(0);
            expect(result.buttons).toBeGreaterThan(0);
          });
          EOF

      - name: Run CORE runtime audit
        run: npx playwright test

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/bagheri-server.log || true
