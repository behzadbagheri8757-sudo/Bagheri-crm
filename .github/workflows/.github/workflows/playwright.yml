name: BAGHERI CRM FULL RUNTIME AUDIT

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start BAGHERI CRM
        run: |
          nohup python3 -m http.server 8080 > server.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:8080/index.html

      - name: Create Playwright config
        run: |
          cat > playwright.config.js <<'EOF'
          const { defineConfig } = require('@playwright/test');

          module.exports = defineConfig({
            testDir: './tests',
            timeout: 30000,
            expect: {
              timeout: 5000
            },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            reporter: [
              ['line'],
              ['html', {
                outputFolder: 'playwright-report',
                open: 'never'
              }]
            ],
            use: {
              baseURL: 'http://127.0.0.1:8080',
              browserName: 'chromium',
              headless: true,
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'retain-on-failure'
            }
          });
          EOF

      - name: Create full runtime audit
        run: |
          mkdir -p tests

          cat > tests/full-runtime-audit.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');

          const BASE = 'http://127.0.0.1:8080';

          async function boot(page) {
            await page.goto('/index.html', {
              waitUntil: 'domcontentloaded'
            });

            await page.waitForTimeout(4000);
          }

          async function collectRuntime(page) {
            return await page.evaluate(async () => {
              const result = {
                url: location.href,
                title: document.title,
                readyState: document.readyState,
                bodyText: document.body?.innerText || '',
                buttons: [...document.querySelectorAll('button')].map(x => ({
                  id: x.id || '',
                  text: (x.innerText || x.textContent || '').trim(),
                  disabled: !!x.disabled
                })),
                inputs: [...document.querySelectorAll('input')].map(x => ({
                  id: x.id || '',
                  type: x.type || '',
                  placeholder: x.placeholder || '',
                  name: x.name || ''
                })),
                links: [...document.querySelectorAll('a')].map(x => ({
                  text: (x.innerText || x.textContent || '').trim(),
                  href: x.getAttribute('href') || ''
                })),
                serviceWorker: {
                  supported: 'serviceWorker' in navigator,
                  registrations: []
                },
                localStorageKeys: Object.keys(localStorage),
                indexedDB: []
              };

              if ('serviceWorker' in navigator) {
                try {
                  const regs =
                    await navigator.serviceWorker.getRegistrations();

                  result.serviceWorker.registrations = regs.map(r => ({
                    scope: r.scope,
                    active: r.active?.scriptURL || null,
                    waiting: r.waiting?.scriptURL || null,
                    installing: r.installing?.scriptURL || null
                  }));
                } catch (e) {
                  result.serviceWorker.error = String(e);
                }
              }

              if (indexedDB.databases) {
                try {
                  result.indexedDB = await indexedDB.databases();
                } catch (e) {
                  result.indexedDBError = String(e);
                }
              }

              return result;
            });
          }

          test('01 - Application boots without uncaught runtime errors', async ({ page }) => {
            const pageErrors = [];
            const consoleErrors = [];

            page.on('pageerror', e => pageErrors.push(e.message));

            page.on('console', msg => {
              if (msg.type() === 'error') {
                consoleErrors.push(msg.text());
              }
            });

            await boot(page);

            expect(pageErrors, pageErrors.join('\n')).toEqual([]);
            expect(consoleErrors, consoleErrors.join('\n')).toEqual([]);

            await expect(page.locator('body')).toBeVisible();
          });

          test('02 - Critical resources do not return HTTP errors', async ({ request }) => {
            const files = [
              '/index.html',
              '/manifest.json',
              '/sw.js',

              '/js/app.js',
              '/js/db.js',
              '/js/models.js',
              '/js/calc.js',
              '/js/stock.js',
              '/js/backup.js',
              '/js/icons.js',
              '/js/nav.js',
              '/js/router.js',
              '/js/computation-bank.js',

              '/js/views/dashboard.js',
              '/js/views/customers.js',
              '/js/views/invoices.js',
              '/js/views/payments.js',
              '/js/views/checks.js',
              '/js/views/suppliers.js',
              '/js/views/settings.js'
            ];

            const failures = [];

            for (const file of files) {
              const response = await request.get(BASE + file);

              if (!response.ok()) {
                failures.push(
                  `${file} -> HTTP ${response.status()}`
                );
              }
            }

            expect(failures, failures.join('\n')).toEqual([]);
          });

          test('03 - Service Worker registers', async ({ page }) => {
            await boot(page);

            const result = await page.evaluate(async () => {
              if (!('serviceWorker' in navigator)) {
                return { supported: false, registrations: [] };
              }

              const registrations =
                await navigator.serviceWorker.getRegistrations();

              return {
                supported: true,
                registrations: registrations.map(r => ({
                  scope: r.scope,
                  active: r.active?.scriptURL || null
                }))
              };
            });

            expect(result.supported).toBeTruthy();
            expect(
              result.registrations.length,
              'No Service Worker registration found'
            ).toBeGreaterThan(0);
          });

          test('04 - Application survives offline reload after initial boot', async ({ page, context }) => {
            await boot(page);

            await context.setOffline(true);

            await page.reload({
              waitUntil: 'domcontentloaded',
              timeout: 15000
            });

            await page.waitForTimeout(3000);

            await expect(page.locator('body')).toBeVisible();

            await context.setOffline(false);
          });

          test('05 - Settings restore controls are real and interactive', async ({ page }) => {
            await boot(page);

            await page.evaluate(() => {
              location.hash = '#/settings';
            });

            await page.waitForTimeout(2500);

            await expect(page.locator('#import-file')).toBeVisible();
            await expect(page.locator('#do-import')).toBeVisible();
            await expect(page.locator('#undo-import')).toBeVisible();
          });

          test('06 - Failed Restore does not silently become a successful restore', async ({ page }) => {
            await boot(page);

            await page.evaluate(() => {
              location.hash = '#/settings';
            });

            await page.waitForTimeout(2500);

            const importFile = page.locator('#import-file');
            const importButton = page.locator('#do-import');

            await expect(importFile).toBeVisible();
            await expect(importButton).toBeVisible();

            await importFile.setInputFiles({
              name: 'INVALID-BAGHERI-BACKUP.json',
              mimeType: 'application/json',
              buffer: Buffer.from(
                '{"this_is_not_a_valid_bagheri_backup":true}'
              )
            });

            page.once('dialog', async dialog => {
              await dialog.accept();
            });

            let reloadObserved = false;

            const reloadPromise = page.waitForEvent('load', {
              timeout: 5000
            }).then(() => {
              reloadObserved = true;
            }).catch(() => {});

            await importButton.click();

            await Promise.race([
              reloadPromise,
              page.waitForTimeout(6000)
            ]);

            const after = await page.evaluate(() => ({
              url: location.href,
              bodyText: document.body?.innerText || '',
              hasSettings: !!document.querySelector('#import-file')
            }));

            console.log(
              'FAILED_RESTORE_RESULT=' +
              JSON.stringify({
                reloadObserved,
                ...after
              })
            );

            /*
             * This is intentionally diagnostic.
             * We do NOT fail merely because reload happened,
             * because the exact expected behavior depends on
             * importBackupJSON's internal failure contract.
             *
             * We require that the application remains alive.
             */
            expect(page.locator('body')).toBeVisible();
          });

          test('07 - Settings page has no duplicate critical restore IDs', async ({ page }) => {
            await boot(page);

            await page.evaluate(() => {
              location.hash = '#/settings';
            });

            await page.waitForTimeout(2500);

            const ids = await page.evaluate(() => {
              return ['import-file', 'do-import', 'undo-import']
                .map(id => ({
                  id,
                  count: document.querySelectorAll('#' + id).length
                }));
            });

            for (const item of ids) {
              expect(
                item.count,
                `${item.id} appears ${item.count} times`
              ).toBe(1);
            }
          });

          test('08 - Customer search accepts normal numeric input without crashing', async ({ page }) => {
            await boot(page);

            await page.evaluate(() => {
              location.hash = '#/customers';
            });

            await page.waitForTimeout(2500);

            const search = page.locator(
              'input[type="search"], input[placeholder*="جستجو"], input[placeholder*="جست"]'
            ).first();

            if (await search.count() === 0) {
              console.log('CUSTOMER_SEARCH_INPUT_NOT_FOUND');
              return;
            }

            await search.fill('123');
            await page.waitForTimeout(500);

            await expect(page.locator('body')).toBeVisible();
          });

          test('09 - Persian digit search path does not crash customer view', async ({ page }) => {
            await boot(page);

            await page.evaluate(() => {
              location.hash = '#/customers';
            });

            await page.waitForTimeout(2500);

            const search = page.locator(
              'input[type="search"], input[placeholder*="جستجو"], input[placeholder*="جست"]'
            ).first();

            if (await search.count() === 0) {
              console.log('CUSTOMER_SEARCH_INPUT_NOT_FOUND');
              return;
            }

            await search.fill('۱۲۳');
            await page.waitForTimeout(500);

            await expect(page.locator('body')).toBeVisible();
          });

          test('10 - Core SPA routes do not produce uncaught JS errors', async ({ page }) => {
            const routes = [
              '#/',
              '#/customers',
              '#/products',
              '#/invoices',
              '#/payments',
              '#/checks',
              '#/suppliers',
              '#/settings',
              '#/visits',
              '#/prospects',
              '#/reports'
            ];

            for (const route of routes) {
              const errors = [];

              page.removeAllListeners('pageerror');

              page.on('pageerror', e => {
                errors.push(e.message);
              });

              await page.evaluate(route => {
                location.hash = route;
              }, route);

              await page.waitForTimeout(1200);

              console.log(
                `ROUTE ${route} ERRORS: ${JSON.stringify(errors)}`
              );

              expect(
                errors,
                `${route} produced runtime errors: ${errors.join(' | ')}`
              ).toEqual([]);

              await expect(page.locator('body')).toBeVisible();
            }
          });

          test('11 - Reload preserves application bootability', async ({ page }) => {
            await boot(page);

            await page.reload({
              waitUntil: 'domcontentloaded'
            });

            await page.waitForTimeout(3000);

            await expect(page.locator('body')).toBeVisible();
          });

          test('12 - Runtime diagnostic snapshot', async ({ page }) => {
            const errors = [];
            const failedRequests = [];

            page.on('pageerror', e => errors.push(e.message));

            page.on('requestfailed', request => {
              failedRequests.push({
                url: request.url(),
                failure: request.failure()
              });
            });

            await boot(page);

            const snapshot = await collectRuntime(page);

            console.log(
              '=== FINAL BAGHERI RUNTIME SNAPSHOT ==='
            );

            console.log(
              JSON.stringify(snapshot, null, 2)
            );

            console.log(
              '=== PAGE ERRORS ==='
            );

            console.log(
              JSON.stringify(errors, null, 2)
            );

            console.log(
              '=== FAILED REQUESTS ==='
            );

            console.log(
              JSON.stringify(failedRequests, null, 2)
            );

            expect(snapshot.readyState).not.toBe('loading');
          });
          EOF

      - name: Run FULL Runtime Audit
        run: npx playwright test tests/full-runtime-audit.spec.js

      - name: Upload full runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagheri-full-runtime-audit
          path: |
            playwright-report/
            test-results/
            server.log
          retention-days: 30
          if-no-files-found: ignore
