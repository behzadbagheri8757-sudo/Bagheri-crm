<script>
/* Apply saved theme before first paint (prevents flash of wrong/default theme).
   Reads the same key/logic as the picker in js/views/settings.js. */
(function(){
  try{
    var t = localStorage.getItem('baqeri_theme_v1');
    if(t && t !== 'default'){
      document.documentElement.setAttribute('data-theme', t);
    }
  }catch(e){}
})();
</script>
